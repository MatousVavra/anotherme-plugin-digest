name: digest
version: 0.2.0
description: Daily digest of projects, people, mood, and pending questions
author: AnotherMe
entrypoint: plugin
capabilities:
  - routes
  - events
dependencies:
  - memory
soft_dependencies:
  - name: chat
    enables: "conversation count in digest"
settings:
  - key: schedule
    label: "Generation schedule"
    type: text
    default: "daily"
    description: "When to generate digests"
